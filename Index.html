<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gerador de Faixa Numérica</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Google Fonts Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    body {
      background: linear-gradient(135deg, #ece9e6, #ffffff);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 30px 15px;
      color: #333;
    }

    h3 {
      font-weight: 600;
      color: #2c3e50;
      text-align: center;
      margin-bottom: 30px;
      letter-spacing: 1.2px;
    }

    .card {
      border: none;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.07);
      margin-bottom: 30px;
      background: #fff;
      transition: box-shadow 0.3s ease;
    }

    .card:hover {
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
    }

    label {
      font-weight: 600;
      color: #34495e;
    }

    select.form-select,
    input.form-control {
      border-radius: 10px;
      border: 1.8px solid #ced4da;
      padding: 12px 15px;
      font-size: 1rem;
      transition: border-color 0.3s ease;
    }

    select.form-select:focus,
    input.form-control:focus {
      border-color: #3498db;
      box-shadow: 0 0 8px rgba(52, 152, 219, 0.4);
      outline: none;
    }

    button.btn-primary {
      background: linear-gradient(45deg, #4e91f9, #376ed9);
      border: none;
      border-radius: 50px;
      padding: 14px 0;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 1.1px;
      transition: background 0.4s ease;
      box-shadow: 0 8px 15px rgba(70, 130, 230, 0.3);
    }

    button.btn-primary:hover {
      background: linear-gradient(45deg, #376ed9, #2a54b0);
      box-shadow: 0 10px 20px rgba(40, 90, 160, 0.5);
    }

    #resultado .alert {
      border-radius: 15px;
      font-weight: 600;
      font-size: 1.2rem;
      background: #d4edda;
      color: #155724;
      border: none;
      box-shadow: 0 6px 15px rgba(40, 167, 69, 0.25);
      text-align: center;
    }

    #historico {
      max-height: 280px;
      overflow-y: auto;
    }

    #historico li {
      border-radius: 12px;
      margin-bottom: 8px;
      transition: background-color 0.3s ease;
    }

    #historico li:hover {
      background-color: #f1f7ff;
    }

    .card-title {
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 15px;
      font-size: 1.3rem;
      letter-spacing: 0.5px;
    }

    /* Scrollbar customizada para histórico */
    #historico::-webkit-scrollbar {
      width: 7px;
    }

    #historico::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }

    #historico::-webkit-scrollbar-thumb {
      background: #3498db;
      border-radius: 10px;
    }

    /* Mobile adjustments */
    @media (max-width: 576px) {
      body {
        padding: 20px 10px;
      }

      button.btn-primary {
        font-size: 1rem;
        padding: 12px 0;
      }
    }

    /* Notificação flutuante */
    .toast-notificacao {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #28a745; /* verde */
      color: white;
      padding: 15px 25px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(40, 167, 69, 0.4);
      display: flex;
      align-items: center;
      gap: 15px;
      min-width: 280px;
      font-weight: 600;
      font-size: 1.1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 1050;
    }

    .toast-notificacao.show {
      opacity: 1;
      pointer-events: auto;
    }

    .toast-notificacao .icon {
      font-size: 1.6rem;
    }

    .toast-notificacao button#fecharNotif {
      background: transparent;
      border: none;
      color: white;
      font-size: 1.5rem;
      font-weight: 700;
      cursor: pointer;
      margin-left: auto;
      line-height: 1;
      padding: 0;
    }

    .toast-notificacao button#fecharNotif:hover {
      color: #d4d4d4;
    }
  </style>
</head>
<body>

<div class="container">
  <h3>🎯 Gerador Numérico com Drop</h3>

  <div class="card shadow-sm">
    <div class="card-body">
      <form id="geradorForm" novalidate>
        <div class="mb-4">
          <label for="drop">Selecione o Drop:</label>
          <select class="form-select" id="drop" required>
            <option value="" disabled selected>Escolha...</option>
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="150">150</option>
            <option value="200">200</option>
            <option value="300">300</option>
          </select>
        </div>

        <div class="mb-4">
          <label for="metragem">Metragem utilizada:</label>
          <input type="number" class="form-control" id="metragem" min="1" placeholder="Informe a metragem" required />
        </div>

        <button type="submit" class="btn btn-primary w-100">Gerar</button>
      </form>
    </div>
  </div>

  <div id="resultado" class="text-center d-none">
    <div class="alert" role="alert">
      <div><strong>Início:</strong> <span id="numeroInicial"></span></div>
      <div><strong>Final:</strong> <span id="numeroFinal"></span></div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <h5 class="card-title">📜 Histórico</h5>
      <ul id="historico" class="list-group"></ul>
    </div>
  </div>
</div>

<!-- Notificação flutuante -->
<div id="notificacao" class="toast-notificacao d-none" role="alert" aria-live="assertive" aria-atomic="true">
  <div class="toast-content">
    <div class="icon">&#10004;</div>
    <div class="mensagem"></div>
    <button id="fecharNotif" aria-label="Fechar">&times;</button>
  </div>
</div>

<script>
  const form = document.getElementById('geradorForm');
  const resultadoDiv = document.getElementById('resultado');
  const numeroInicialSpan = document.getElementById('numeroInicial');
  const numeroFinalSpan = document.getElementById('numeroFinal');
  const historicoList = document.getElementById('historico');

  const notificacao = document.getElementById('notificacao');
  const mensagemNotif = notificacao.querySelector('.mensagem');
  const btnFecharNotif = document.getElementById('fecharNotif');
  let timeoutNotif;

  window.onload = () => {
    mostrarHistorico();
  };

  btnFecharNotif.onclick = () => {
    clearTimeout(timeoutNotif);
    notificacao.classList.remove('show');
    setTimeout(() => notificacao.classList.add('d-none'), 500);
  };

  function mostrarNotificacao(texto) {
    mensagemNotif.textContent = texto;
    notificacao.classList.add('show');
    notificacao.classList.remove('d-none');

    clearTimeout(timeoutNotif);
    timeoutNotif = setTimeout(() => {
      notificacao.classList.remove('show');
      setTimeout(() => notificacao.classList.add('d-none'), 500);
    }, 5000);
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    const drop = parseInt(document.getElementById('drop').value);
    const metragem = parseInt(document.getElementById('metragem').value);

    if (!drop || !metragem) {
      mostrarNotificacao('Por favor, preencha todos os campos.');
      return;
    }

    if (metragem > drop) {
      mostrarNotificacao('❌ A metragem não pode ser maior que o Drop selecionado.');
      return;
    }

    const numeroInicial = Math.floor(Math.random() * 9000) + 1000;
    const numeroFinal = numeroInicial + metragem;

    numeroInicialSpan.textContent = numeroInicial;
    numeroFinalSpan.textContent = numeroFinal;
    resultadoDiv.classList.remove('d-none');

    mostrarNotificacao(`✅ Números gerados com sucesso!`);

    const registro = {
      drop,
      metragem,
      inicio: numeroInicial,
      fim: numeroFinal,
      data: new Date().toLocaleString()
    };

    salvarHistorico(registro);
    mostrarHistorico();
    form.reset();
  });

  function salvarHistorico(registro) {
    let historico = JSON.parse(localStorage.getItem("historicoDrop")) || [];
    historico.unshift(registro);
    localStorage.setItem("historicoDrop", JSON.stringify(historico.slice(0, 10)));
  }

  function mostrarHistorico() {
    historicoList.innerHTML = "";
    const historico = JSON.parse(localStorage.getItem("historicoDrop")) || [];

    if (historico.length === 0) {
      historicoList.innerHTML = `<li class="list-group-item text-muted">Nenhum histórico disponível.</li>`;
      return;
    }

    historico.forEach(item => {
      const li = document.createElement('li');
      li.className = "list-group-item";
      li.innerHTML = `
        <strong>${item.data}</strong><br>
        Drop: ${item.drop} | Metragem: ${item.metragem} <br>
        Início: ${item.inicio} | Final: ${item.fim}
      `;
      historicoList.appendChild(li);
    });
  }
</script>

</body>
</html>
